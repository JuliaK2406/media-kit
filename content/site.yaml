faq:
  enabled: true
  title: "Frequently asked questions"
  items:
    - q: "How far in advance should we book?"
      a: "Six to eight weeks is comfortable for a keynote or workshop, and gives me time to tailor the content. Shorter notice is sometimes possible, so it's always worth asking."
    - q: "Do you travel outside the Netherlands?"
      a: "Yes. I'm based in Amsterdam and travel in person across Europe. Travel further afield is possible by arrangement."
    - q: "Are you available for online engagements?"
      a: "Yes for workshops: I'm very comfortable delivering these online. For keynotes, it depends on the length and format required, so it's worth discussing on a call."
    - q: "Can the talk be adapted to our theme?"
      a: "Yes. Every session can be shaped around your audience and objectives, worked out on a call beforehand."
    - q: "May we record the session?"
      a: "Recording for internal use within your organisation is fine. For public distribution, please ask in advance."

about:
  photo: julia-krylova-headshot.jpg
  # this same text is the press kit bio below, edit it once here
  bio_long: &main_bio |
    I spent 25+ years as an international executive and creative producer, including a decade at Sony Masterworks, producing 65+ projects across 35+ countries and collaborating with organisations including Netflix and Warner Bros., and iconic artists including Ennio Morricone and Priscilla Presley.

    Leading high-stakes productions in traditionally male-dominated environments taught me what it really takes to lead: not just competence, but presence, resilience, and the ability to influence without burning out.

    Today I'm a keynote speaker, strategic mentor, and published author, helping leaders communicate with more authority, clarity, and ease. Through my Mosaic of Life Method™, I work extensively with senior women leaders navigating rapidly growing responsibility, though the same tools apply to any leader stretched across too many demands.

    My sessions are structured, highly practical, and built for immediate use: clear frameworks and takeaways teams can apply the same day.

    Based in Amsterdam, I deliver keynotes and interactive sessions internationally, in person and online. I'm fluent in English and Russian and can deliver sessions in both languages.

