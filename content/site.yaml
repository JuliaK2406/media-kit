topics:
  - title: "Leadership Communication and Influence"
    summary: "Most senior people do not lack substance. They over-explain, soften the ask and lose the room before they reach the point. This talk shows where authority is actually established, what erodes it, and how to keep it without raising your voice."
    takeaways:
      - "A structure for saying something difficult in under a minute"
      - "Why over-explaining reads as uncertainty, and what to do instead"
      - "How to hold a room when you are interrupted or challenged"
      - "A short way to prepare for a high-stakes conversation"
    formats: ["Keynote 45 min", "Interactive workshop 2 to 3 h", "Fireside chat 30 min"]

  - title: "Executive Presence That Lands"
    summary: "Presence is usually treated as something you either have or you do not. Twenty-five years of live production says otherwise. Presence is message structure, voice, timing and attention, and every one of those can be rehearsed. This session takes it apart and hands it back as a skill."
    takeaways:
      - "The components of presence, and which one to fix first"
      - "How to use pause and pace instead of volume"
      - "What changes on a video call and what does not"
      - "A practice that keeps the skill between speaking moments"
    formats: ["Keynote 45 min", "Interactive workshop 2 to 3 h", "Half-day training"]

  - title: "Mosaic of Life: How Ambitious Leaders Build Sustainable Success"
    summary: "Ambitious people are told to find balance, which usually means doing less of what they care about. Mosaic of Life offers a different frame: energy, time, relationships, career and visibility as pieces that have to fit together rather than compete. It is the method Julia has built with more than 170 leaders since 2019."
    takeaways:
      - "Why balance is the wrong target, and what to aim at instead"
      - "How to see which part of your life is draining the others"
      - "How visibility can grow without costing more hours"
      - "What sustainable ambition looks like in practice"
    formats: ["Keynote 45 min", "Interactive workshop 2 to 3 h"]

