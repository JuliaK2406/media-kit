faq:
  enabled: true
  title: "Frequently asked questions"
  items:
    - q: "How far in advance should we book?"
      a: "Six to eight weeks is comfortable for a keynote or workshop, and gives me time to tailor the content. Shorter notice is sometimes possible, so it's always worth asking."
    - q: "Do you travel outside the Netherlands?"
      a: "Yes. I'm based in Amsterdam and travel in person across Europe. Travel further afield is possible by arrangement."
    - q: "Are you available for online engagements?"
      a: "Yes for workshops: I'm very comfortable delivering these online. For keynotes, it depends on the length and format required, so it's worth discussing on a call."
    - q: "Can the talk be adapted to our theme?"
      a: "Yes. Every session can be shaped around your audience and objectives, worked out on a call beforehand."
    - q: "May we record the session?"
      a: "Recording for internal use within your organisation is fine. For public distribution, please ask in advance."

about:
  photo: julia-krylova-headshot.jpg
  bio_long: |
    I spent twenty-five years making sure other people looked ready when the lights came up.

    As an executive and creative producer I delivered more than sixty large-scale international productions across thirty-five countries, leading teams of up to two hundred and fifty people. The work ran from Royal Albert Hall to Arena di Verona, with Sony, Disney, Netflix, Paramount and the European Space Agency, and on projects alongside artists including Ennio Morricone. Live production leaves no room for the idea that presence is something you are born with. A performer either holds the room or does not, and the difference is almost always craft: how the message is built, how the voice carries it, where the attention goes, what happens in the pause.

    I now teach that craft to leaders. Since 2019 I have worked with executives and entrepreneurs through keynotes, corporate workshops and my own mentoring method, Mosaic of Life, which more than one hundred and seventy people have gone through. My corporate work includes sessions for KPMG, Oracle, Heineken and Avery Dennison, usually on executive presence, leadership communication and the kind of visibility that does not cost more hours than it returns.

    My subject is the gap between having something worth saying and being heard saying it. Senior people rarely lack substance. They over-explain, soften the ask, and lose the room before they arrive at the point. I take that apart into components that can be rehearsed, and give people something to practise on Monday rather than something to feel inspired about on Friday.

    I am the author of the Mosaic of Life method and book, founder of Mastermind Society, and am based in Amsterdam. I work internationally and speak in English and Russian.

