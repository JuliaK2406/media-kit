topics_section:
  title: "What I speak about" # confirm: формулировка из документа, возможно имелся в виду рабочий подзаголовок
  intro: |
    I speak in different formats: from hands-on workshops and keynotes to moderated panel discussions. The topics I am passionate about are: Leadership, Communication & Influence, Sustainable Success.

    My work blends global stage experience with practical mentoring tools your audience can apply immediately.
    Below is a selection of my topics for workshops and keynotes.

topics:
  - title: "Leadership Communication & Influence"
    summary: |
      The next level of your career is rarely about working harder: it's about communicating with more authority, clarity, and influence, while delivering with ease.

      I break down how presence is created through message structure, voice and delivery, cultural awareness and the ability to hold a room under pressure. You will learn how to turn strong expertise into presence that lands: clear, persuasive, and impossible to overlook.
    formats: ["Keynote 45 min", "Interactive workshop 2 to 3 h"]

  - title: "Mosaic of Life: How Ambitious Leaders Build Sustainable Success"
    summary: |
      Sustainable success isn't about controlling life, it's about managing the key segments that shape it: your energy & time, making strategic career decisions, and managing your visibility. We will explore the internal fears and limitations influencing your decisions, learn how to shift your emotional state in the moment, and reconnect with your authentic ambitions and direction.
    formats: ["Keynote 45 min", "Interactive workshop 2 to 3 h"]

  - title: "Empowering Lessons from Hollywood Legends"
    summary: |
      Some of the most powerful leadership lessons don't come from a boardroom: mine came from two decades producing for icons like Ennio Morricone, James Newton Howard, and Priscilla Presley.

      I share the stories behind their success and turn them into practical tools: how to act on your ambitions without waiting for "the right moment," the routines and discipline that sustain a powerful leader, and how to build real balance without giving up growth.

      Through reflection and hands-on exercises, you will get a fresh lens on your own decisions, work flow and goals.
    formats: ["Keynote 45 min", "Interactive workshop 2 to 3 h"] # confirm: длительности третьей темы заказчица не называла

