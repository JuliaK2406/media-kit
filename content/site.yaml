about:
  photo: julia-krylova-headshot.jpg
  bio_long: |
    Julia Krylova spent twenty-five years making sure other people looked ready when the lights came up.

    As an executive and creative producer she delivered more than sixty large-scale international productions across thirty-five countries, leading teams of up to two hundred and fifty people. The work ran from Royal Albert Hall to Arena di Verona, with Sony, Disney, Netflix, Paramount and the European Space Agency, and on projects alongside artists including Ennio Morricone. Live production leaves no room for the idea that presence is something you are born with. A performer either holds the room or does not, and the difference is almost always craft: how the message is built, how the voice carries it, where the attention goes, what happens in the pause.

    She now teaches that craft to leaders. Since 2019 she has worked with executives and entrepreneurs through keynotes, corporate workshops and her own mentoring method, Mosaic of Life, which more than one hundred and seventy people have gone through. Her corporate work includes sessions for KPMG, Oracle, Heineken and Avery Dennison, usually on executive presence, leadership communication and the kind of visibility that does not cost more hours than it returns.

    Her subject is the gap between having something worth saying and being heard saying it. Senior people rarely lack substance. They over-explain, soften the ask, and lose the room before they arrive at the point. Julia takes that apart into components that can be rehearsed, and gives people something to practise on Monday rather than something to feel inspired about on Friday.

    She is the author of the Mosaic of Life method and book, founder of Mastermind Society, and is based in Amsterdam. She works internationally and speaks in English and Russian.

